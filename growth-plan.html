<!doctype html>
<html lang="en">
<head>
<script>
/* hubSession:begin v1 -- this block is identical in every page that signs in to the Hub; edit all copies together */
(function () {
  // One place that knows where the Hub session lives. An admin session is kept in localStorage so every
  // Verlocity tool (same origin) opens already signed in, in any tab or window, until the token expires,
  // MAX_SHARED_MS have passed since sign-in, or the user signs out. A bank_user session stays in
  // sessionStorage (this tab only), as before.
  var KEYS = ['hub_token', 'hub_role', 'hub_inst_key', 'hub_email', 'hub_saved_at'];
  var TOKEN = 'hub_token';
  var SAVED = 'hub_saved_at';   // when the shared copy was written; set by save() ONLY, never refreshed
  var SKEW_MS = 5000;
  var WATCH_MS = 30000;
  var MAX_SHARED_MS = 4 * 60 * 60 * 1000;   // the shared copy is honoured for at most 4 h (or the token's own expiry, if sooner)

  function pick(name) {
    // Read-only probe: blocked storage throws here. (A write probe would fire a storage event in every other tab.)
    try {
      var s = window[name];
      s.getItem(TOKEN);
      return s;
    } catch (e) { return null; }
  }
  var LS = pick('localStorage');
  var SS = pick('sessionStorage');
  var hadToken = false;

  // The token is base64url("subject:role:inst_key:exp:signature"). The browser can read role and expiry from it
  // (they are not secret) but cannot check the signature; the server does that on every request.
  function decode(token) {
    try {
      if (typeof token !== 'string' || !token) return null;
      var b64 = token.replace(/-/g, '+').replace(/_/g, '/');
      while (b64.length % 4) b64 += '=';
      var parts = atob(b64).split(':');
      if (parts.length < 5) return null;
      var exp = Number(parts[parts.length - 2]);
      if (!isFinite(exp) || exp <= 0) return null;
      if (!/^[0-9a-f]{64}$/.test(parts[parts.length - 1])) return null;
      return { subject: parts[0], role: parts[1], exp: exp };
    } catch (e) { return null; }
  }

  function read(store, key) {
    try { return store ? store.getItem(key) : null; } catch (e) { return null; }
  }
  function wipe(store) {
    if (!store) return;
    KEYS.forEach(function (k) { try { store.removeItem(k); } catch (e) {} });
  }
  function holder() {
    if (read(SS, TOKEN) !== null) return SS;
    if (read(LS, TOKEN) !== null) return LS;
    return null;
  }

  // Forget this tab's session: only the store that holds it, so a bank_user tab that gets a 401 can never wipe
  // an admin session shared with other tabs. With no session anywhere, tidy both.
  function clear() {
    var from = holder();
    if (from) wipe(from); else { wipe(SS); wipe(LS); }
    hadToken = false;
    unmount();
  }

  // A shared (localStorage) copy with a missing, unreadable or future timestamp is not trusted.
  function sharedTooOld(now) {
    var at = Number(read(LS, SAVED));
    if (!isFinite(at) || at <= 0 || at > now + SKEW_MS) return true;
    return at + MAX_SHARED_MS <= now + SKEW_MS;
  }

  function getToken() {
    var from = holder();
    if (!from) return null;
    var token = read(from, TOKEN);
    var info = decode(token);
    var now = Date.now();
    if (!info || info.exp * 1000 <= now + SKEW_MS || (from === LS && sharedTooOld(now))) { clear(); return null; }
    return token;
  }

  function get(key) {
    if (key === TOKEN) return getToken();
    var from = getToken() ? holder() : null;
    return from ? read(from, key) : null;
  }

  // Store a successful sign-in (the /auth/login response). Persist only when the signed token itself says admin.
  function save(data) {
    var token = data && data.token;
    var info = decode(token);
    var persist = !!(info && info.role === 'admin' && LS);
    var target = persist ? LS : SS;
    // Replace the session we are writing to; also drop this tab's own earlier copy. Never touch the shared
    // admin session when this tab is saving a tab-only (bank_user) one.
    var previous = holder();
    wipe(target);
    if (previous === SS && target !== SS) wipe(SS);
    var values = { hub_token: token, hub_role: data && data.role, hub_inst_key: data && data.inst_key, hub_email: data && data.email };
    // The timestamp goes in FIRST so no other tab can ever see a shared token without it.
    var order = ['hub_token', 'hub_role', 'hub_inst_key', 'hub_email'];
    try {
      if (persist) target.setItem(SAVED, String(Date.now()));
      order.forEach(function (k) { if (values[k]) target.setItem(k, values[k]); });
    } catch (e) {
      wipe(LS);
      if (SS) order.forEach(function (k) { try { if (values[k]) SS.setItem(k, values[k]); } catch (e2) {} });
    }
    hadToken = !!holder();
    mount();
  }

  function signOut() { clear(); location.reload(); }

  function unmount() {
    try {
      var el = document.getElementById('hubSignOut');
      if (el && el.parentNode) el.parentNode.removeChild(el);
    } catch (e) {}
  }
  function mount() {
    try {
      if (!document.body || document.getElementById('hubSignOut') || !holder()) return;
      var b = document.createElement('button');
      b.id = 'hubSignOut';
      b.type = 'button';
      b.textContent = 'Sign out';
      b.setAttribute('style', 'position:fixed;right:12px;bottom:12px;z-index:2147483000;background:rgba(8,61,95,.88);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:6px;padding:5px 11px;font:600 11px Inter,system-ui,sans-serif;cursor:pointer');
      b.onclick = signOut;
      document.body.appendChild(b);
    } catch (e) {}
  }

  // Signed in or out in another tab (storage events only reach the OTHER tabs): follow it.
  window.addEventListener('storage', function (e) {
    if (LS && e.storageArea && e.storageArea !== LS) return;
    if (e.key !== null && e.key !== TOKEN) return;
    var now = !!getToken();
    if (now !== hadToken) location.reload();
  });
  // Drop an expired token even if the tab is just sitting there.
  function check() { if (hadToken && !getToken()) location.reload(); }
  setInterval(check, WATCH_MS);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) check(); });

  hadToken = !!getToken();
  document.addEventListener('DOMContentLoaded', mount);

  window.hubSession = { getToken: getToken, get: get, save: save, clear: clear, signOut: signOut, decode: decode };
})();
/* hubSession:end */
</script>

<style>
  :root{--navy:#083D5F;--teal:#02A7C2;--amber:#F5A623;--green:#27500A;--lgreen:#EAF3DE;--blue:#185FA5;--lblue:#E6F1FB;--red:#A32D2D;--lred:#FCEBEB;--gray:#F5F5F2;--border:#E0DED8;--text:#213141;--muted:#777;--white:#fff}

  .header{background:var(--navy);padding:5px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid var(--teal);gap:12px;flex-wrap:wrap}

  .btn.teal{background:var(--teal)}
  /* goal bar */

  .strip .line{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .strip .bal .note{font-size:11px;line-height:1.3;margin-top:2px}
  .label{font-size:10px;font-weight:700;letter-spacing:.07em;color:var(--muted);text-transform:uppercase;margin-bottom:6px}
  /* work area */
  .work{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:12px;height:var(--workH,max(440px,calc(100vh - 330px)));align-items:stretch}
  .tablecard,.rightcol{height:100%;min-height:0;min-width:0;display:flex;flex-direction:column;overflow:hidden;padding:0}

  .thead h2{margin:0;font-size:14px;font-weight:700;color:var(--navy)}
  .mode{font-size:11px;background:#FFF8E8;border:1px solid var(--amber);border-radius:6px;padding:2px 8px}
  .tscroll{flex:1;overflow-y:auto;overflow-x:hidden}
  table{width:100%;border-collapse:collapse;table-layout:fixed}
  th{position:sticky;top:0;z-index:1;font-size:10px;font-weight:700;letter-spacing:.05em;color:var(--muted);text-transform:uppercase;text-align:left;padding:0 8px;height:30px;background:#f5f4f0;border-bottom:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  td{height:40px;padding:0 8px;border-bottom:1px solid #f0efe8;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
  tbody tr{cursor:pointer}
  tbody tr:hover td{background:var(--lblue)}
  tr.top td{background:#f1f9fb}
  tr.sel td{background:#FFF3D6!important}
  th.k-rk{width:42px}th.k-dep{width:74px}th.k-score{width:52px}th.k-std{width:78px}th.k-zp{width:168px}th.k-share{width:108px}th.k-why{width:26%}
  .rk{display:inline-block;min-width:24px;height:24px;line-height:24px;text-align:center;border-radius:12px;font-weight:700;font-size:12px}
  .rk.t5{background:var(--teal);color:#fff}
  .nm{display:block;font-weight:700;color:var(--text);line-height:1.25;overflow:hidden;text-overflow:ellipsis}
  .ct{display:block;color:var(--muted);font-weight:400;font-size:11px;line-height:1.25;overflow:hidden;text-overflow:ellipsis}
  .ic{display:inline-block;margin-left:5px;font-size:9px;font-weight:700;border-radius:4px;padding:1px 4px;background:#FBF0DF;color:#854F0B;vertical-align:1px}
  .zone{display:inline-block;padding:1px 7px;border-radius:4px;font-size:11px;font-weight:700;background:#f0efe8;color:var(--muted);white-space:nowrap}
  .zone.Invest{background:var(--lgreen);color:var(--green)}.zone.Analyze{background:var(--lblue);color:var(--blue)}.zone.Defend{background:#FBF0DF;color:#854F0B}.zone.Justify{background:var(--lred);color:var(--red)}
  .play{font-size:12px;color:var(--text);margin-left:4px}
  .up{color:var(--green);font-weight:700}.down{color:var(--red);font-weight:700}
  .why{color:var(--muted);font-size:12px}
  .note{font-size:12px;color:var(--muted)}
  .foot{padding:5px 14px;border-top:1px solid var(--border);font-size:11px;line-height:1.35;color:var(--muted)}
  /* map and detail */
  #mapWrap{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
  #map{flex:1;min-height:0;width:100%;position:relative;z-index:0;background:#e8eef2}
  .maplegend{display:flex;flex-wrap:wrap;gap:4px 12px;padding:6px 12px;border-top:1px solid var(--border);font-size:11px;color:var(--muted);align-items:center}
  .maplegend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
  .leaflet-tooltip.rkt{background:transparent;border:0;box-shadow:none;color:#fff;font-weight:800;font-size:11px;padding:0}
  .leaflet-tooltip.rkt::before{display:none}
  #detail{flex:1;min-height:0;overflow-y:auto}
  .dh{background:var(--navy);color:#fff;padding:10px 14px;position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
  .dh .t{font-size:15px;font-weight:700}
  .dh .s{font-size:12px;color:rgba(255,255,255,.65);margin-top:2px}
  .dsec{padding:10px 14px;border-bottom:1px solid var(--border)}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{background:var(--gray);border:1px solid var(--border);border-radius:7px;padding:5px 9px;font-size:11px}
  .chip b{display:block;font-size:15px;color:var(--navy)}
  .bar{height:8px;background:#f0efe8;border-radius:4px;overflow:hidden;min-width:60px}
  .bar i{display:block;height:100%;background:var(--teal)}
  table.mini{table-layout:auto}
  table.mini th,table.mini td{height:auto;padding:4px 6px;font-size:12px;position:static;white-space:normal}
  .comp{border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin-bottom:8px}
  .rate{display:inline-block;background:var(--lblue);color:var(--blue);border-radius:5px;padding:2px 7px;font-size:11px;margin:4px 4px 0 0}
  .rate.bank{background:var(--lgreen);color:var(--green)}
  .unv{color:#8B93A0;font-style:italic}
  .unv i{font-style:normal;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;background:#ECEAE2;border-radius:3px;padding:1px 4px;margin-left:3px}
  .na{color:#B9BFC8}
  .auto{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;background:#E4EEF7;color:#185FA5;border-radius:3px;padding:1px 4px;margin-left:3px;white-space:nowrap}
  .linkbtn{background:none;border:0;padding:0;color:var(--blue);font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;text-decoration:underline}
  table.rt{margin-top:6px}
  table.rt th:nth-child(n+2),table.rt td:nth-child(n+2){width:38%}
  /* gate and search */
  input[type=text],input[type=email],input[type=password]{width:100%;border:1.5px solid var(--border);border-radius:7px;padding:8px 12px;font-family:inherit;font-size:13px;color:var(--text);outline:none;background:#fff}
  #gate{position:fixed;inset:0;background:var(--navy);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
  #gate .box{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:28px 32px;width:320px;text-align:center}
  #gate .lab{color:rgba(255,255,255,.5);font-size:11px;margin-bottom:14px;letter-spacing:.05em}
  #gate input{background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.15);color:#fff;margin-bottom:10px}
  #gate button{width:100%;background:var(--teal);color:#fff;border:0;border-radius:7px;font-weight:800;font-size:13px;padding:10px;cursor:pointer;font-family:inherit}
  .err{color:var(--teal);font-size:11px;margin-top:8px}
  #results{border:1.5px solid var(--navy);border-radius:8px;background:#fff;margin-top:6px;box-shadow:0 8px 24px rgba(0,0,0,.12);overflow:hidden}
  #results button{display:block;width:100%;text-align:left;padding:9px 14px;border:0;border-bottom:1px solid var(--border);background:#fff;font-family:inherit;font-size:13px;cursor:pointer}
  #results button:hover{background:var(--lblue)}
  @media (max-width:1400px){th.k-why,td.c-why{display:none}}
  @media (max-width:1699px){th.k-zp{width:92px}th.k-why{width:21%}.play{display:none}}
  @media (max-width:1100px){.work{display:block;height:auto}.tablecard{height:auto}.tscroll{max-height:62vh}.rightcol{height:430px;margin-top:12px}}
  @media (max-width:999px){.strip{grid-template-columns:minmax(0,1fr)}}
  @media (max-width:560px){.quad{grid-template-columns:minmax(0,1fr)}}
</style>

<div id="gate">
  <div class="logo"><img src="verlocity-logo.jpg" alt="Verlocity"></div>
  <div class="box">
    <div class="lab">LOG IN &middot; GROWTH PLAN (INTERNAL DRAFT)</div>
    <input id="em" type="email" placeholder="you@verlocity.ai" autocomplete="username" aria-label="Email">
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password" aria-label="Password">
    <div id="gateErr" class="err dn" role="alert"></div>
    <button id="loginBtn" type="button">Sign in</button>
  </div>
</div>

<div id="app" class="dn">
  <div class="header">
    <div style="display:flex;align-items:center;gap:14px">
      <div class="logo"><img src="verlocity-logo.jpg" alt="Verlocity"></div>
      <div style="display:flex;flex-direction:column;gap:1px">
        <div class="htitle">Verlocity Growth Plan</div>
        <div class="hsub">Verlocity &middot; BMAP Intelligence &middot; Internal draft</div>
        <div class="hsub" id="dataDates" title="Branch deposits come from the FDIC Summary of Deposits; balance sheet and peers from the latest call reports."></div>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:10px">
      <span class="live-badge" id="bankName">Choose a bank</span>
      <button type="button" id="changeBank" class="btn teal dn">Change bank</button>
    </div>
  </div>

  <div id="pickWrap" style="padding:14px 20px">
    <div class="card" id="pickCard">
      <div class="label">Choose a bank</div>
      <input type="text" id="si" placeholder="Start typing a bank name" aria-label="Search institutions" autocomplete="off">
      <div id="results" class="dn"></div>
    </div>
  </div>

  <div id="plan" class="dn">
    <div class="gbar" id="gbar" aria-label="Set your goals"></div>
    <main>
      <div class="strip" id="strip"></div>
      <div class="work">
        <div class="card tablecard">
          <div class="thead"><h2>Branches ranked for these goals</h2><span class="mode" id="mode"></span></div>
          <div class="tscroll"><table class="rank">
            <thead><tr id="thead"></tr></thead>
            <tbody id="rows"></tbody>
          </table></div>
          <div class="foot" id="foot"></div>
        </div>
        <div class="card rightcol">
          <div id="mapWrap">
            <div id="map" role="img" aria-label="Map of the bank's branches, sized by deposits and colored by goal rank"></div>
            <div class="maplegend">
              <span><i style="background:#02A7C2"></i>Rank 1 to 5</span>
              <span><i style="background:#185FA5"></i>6 to 15</span>
              <span><i style="background:#8B93A0"></i>Others</span>
              <span><i style="background:#fff;border:2px dashed #854F0B"></i>Head office / booking</span>
              <span title="Branches at nearly the same spot are spread around that spot so each can be seen and clicked. Zoom in for closer to true positions.">Overlaps fanned out</span>
            </div>
          </div>
          <div id="detail" class="dn"></div>
        </div>
      </div>
    </main>
  </div>
</div>

<script>
// ───────────────────────── pure scoring (no DOM) ─────────────────────────
// Weights are a DRAFT: pending confirmation by Brock and Marc. Parts are 0-100.
// Wealth and community each move 30 points to a new part; take-share moves 15;
// the objective and product adjustments add up to 25 more before rescaling.
const FOCUS = {
  core:      { mg: 25, rg: 30, id: 25, ds: 20 },
  wealth:    { mg: 18, rg: 21, id: 17, ds: 14, wl: 30 },
  community: { mg: 18, rg: 21, id: 17, ds: 14, lm: 30 },

function standouts(rows) {
  const pool = rows.filter(r => !r.excluded && r.score !== null);
  const out = new Map();
  if (pool.length < 5) return out;
  const best = new Map();
  STAND_METRICS.forEach(([key, get, top, noun]) => {
    const vals = pool.map(r => ({ r, v: get(r) })).filter(x => x.v !== null && x.v !== undefined && !isNaN(x.v)).sort((a, b) => b.v - a.v);
    if (vals.length < 5) return;
    const cut = Math.max(3, Math.ceil(vals.length * 0.1));
    vals.slice(0, cut).forEach((x, i) => {
      const text = i === 0 ? top : (i < 3 ? 'Top 3 ' + noun : 'Top 10% ' + noun);
      const cur = best.get(x.r.uninumbr);
      if (!cur || i < cur.i) best.set(x.r.uninumbr, { key, text, i });
    });
  });
  best.forEach((v, k) => out.set(k, { key: v.key, text: v.text }));
  return out;
}
const WHY_SHORT = {
  mg: ['growing market', 'slow market'], rg: ['gaining share', 'losing share'], id: ['few rivals', 'crowded market'],
  ds: ['big deposit base', 'small deposit base'], wl: ['high income', 'lower income'], lm: ['lower income', 'higher income'],
  sb: ['small-business area', 'few small firms']
};
// A reason short enough for a table cell: the standout first, then the strongest part,
// or the weak part when there is one.
function whyShort(parts, w, stand) {
  const items = PART_KEYS.filter(k => w[k] > 0 && parts[k] !== null && parts[k] !== undefined).map(k => ({ k, v: parts[k], c: w[k] * parts[k] }));
  if (!items.length) return 'Not enough data';
  const skip = stand ? (stand.key === 'dep' ? 'ds' : stand.key) : null;
  const strong = items.filter(x => x.v >= 70 && x.k !== skip).sort((a, b) => b.c - a.c).map(x => WHY_SHORT[x.k][0]);
  const weak = items.filter(x => x.v < 40).sort((a, b) => a.v - b.v)[0];
  const pick = (stand ? [stand.text] : []).concat(strong);
  const shown = weak ? pick.slice(0, 1).concat(WHY_SHORT[weak.k][1]) : pick.slice(0, 2);
  if (!shown.length) return 'No standout';
  const t = shown.join(' \u00b7 ');
  return t.charAt(0).toUpperCase() + t.slice(1);
}

  const min = Math.min(...nums), max = Math.max(...nums);
  if (min === max) return () => (minR + maxR) / 2;
  return v => { v = Math.max(min, Math.min(max, +v || min)); return minR + Math.sqrt((v - min) / (max - min)) * (maxR - minR); };
}
function markerStyle(r) {
  if (r.excluded) return { fillColor: '#F5A623', color: '#854F0B', weight: 2, dashArray: '4 3', fillOpacity: 0.05, opacity: 0.9 };
  if (r.score === null) return { fillColor: '#ffffff', color: '#8B93A0', weight: 1.5, dashArray: '3 3', fillOpacity: 0.3, opacity: 0.5 };
  if (r.rank <= 5) return { fillColor: '#02A7C2', color: '#083D5F', weight: 2.5, fillOpacity: 0.95, opacity: 1 };
  if (r.rank <= 15) return { fillColor: '#185FA5', color: '#ffffff', weight: 1, fillOpacity: 0.55, opacity: 0.75 };
  return { fillColor: '#8B93A0', color: '#ffffff', weight: 0.6, fillOpacity: 0.25, opacity: 0.45 };
}
function drawMap(rows, key) {
  if (typeof L === 'undefined') return;
  if (!MAP) {
    MAP = L.map('map', { zoomControl: true, attributionControl: false, scrollWheelZoom: false }).setView([37.8, -96], 4);
    L.control.attribution({ prefix: false, position: 'bottomright' }).addTo(MAP);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OpenStreetMap contributors', subdomains: 'abc', maxZoom: 19 }).addTo(MAP);
    MAP_LAYER = L.layerGroup().addTo(MAP);
    MAP.on('zoomend', spreadMarkers);
  }
  MAP_LAYER.clearLayers(); MAP_MARKERS = new Map();
  const pts = rows.filter(r => num(r.sims_latitude) !== null && num(r.sims_longitude) !== null);
  const rs0 = radiusScale(pts.filter(r => !r.excluded).map(r => r.latest_dep), 4, 16);
  pts.forEach(r => {
    const base = r.excluded ? 10 : rs0(r.latest_dep);
    const rad = r.rank <= 5 && !r.excluded ? Math.max(base, 11) + 4 : (r.rank <= 15 ? base : Math.min(base, 8));
    const m = L.circleMarker([+r.sims_latitude, +r.sims_longitude], { radius: rad, ...markerStyle(r) });
    m.bindTooltip(`${esc(cleanName(r.namebr))}: ${r.score === null ? 'no score' : 'score ' + Math.round(r.score)} (#${r.rank})`, { direction: 'top' });
    m.on('click', () => selectBranch(r.uninumbr));
    m.addTo(MAP_LAYER);
    if (r.rank <= 5 && !r.excluded) m.bindTooltip(String(r.rank), { permanent: true, direction: 'center', className: 'rkt' });
    MAP_MARKERS.set(String(r.uninumbr), { m, r });
  });
  const fit = pts.length && key !== MAP_KEY;
  const bounds = pts.map(r => [+r.sims_latitude, +r.sims_longitude]);
  if (fit) { MAP.fitBounds(bounds, { padding: [30, 30], maxZoom: 11 }); MAP_KEY = key; }
  setTimeout(() => { if (!MAP) return; MAP.invalidateSize(); if (fit) MAP.fitBounds(bounds, { padding: [30, 30], maxZoom: 11 }); spreadMarkers(); }, 80);
  spreadMarkers();
  if (SELECTED !== null) hoverRow(SELECTED, true);
}
// Branches that sit on top of each other are fanned out around their shared point, in screen
// space, so every one can be seen and clicked. Zooming in brings them back toward true spots.
function spreadMarkers() {
  if (!MAP || !MAP_MARKERS.size) return;
  const items = [...MAP_MARKERS.values()].map(e => {
    const ll = L.latLng(+e.r.sims_latitude, +e.r.sims_longitude);
    e.m.setLatLng(ll);
    return { e, p: MAP.latLngToContainerPoint(ll), rad: e.m.getRadius() };
  });
  const used = new Set(), groups = [];
  items.forEach(it => {
    if (used.has(it)) return;
    const grp = [it]; used.add(it);
    for (let i = 0; i < grp.length; i++) {
      items.forEach(o => { if (!used.has(o) && grp[i].p.distanceTo(o.p) < (grp[i].rad + o.rad) * 0.75) { grp.push(o); used.add(o); } });
    }
    groups.push(grp);
  });
  groups.forEach(grp => {
    if (grp.length < 2) return;
    const cx = grp.reduce((a, it) => a + it.p.x, 0) / grp.length, cy = grp.reduce((a, it) => a + it.p.y, 0) / grp.length;
    const sumR = grp.reduce((a, it) => a + it.rad, 0), maxR = Math.max(...grp.map(it => it.rad));
    const R = Math.max(maxR * 1.2, 1.2 * sumR / Math.PI);
    grp.sort((a, b) => a.e.r.rank - b.e.r.rank);
    // up to six: a ring; more: a sunflower packing with the best-ranked branch in the middle
    const gap = 2 * sumR / grp.length * 0.9;
    grp.forEach((it, i) => {
      let dx, dy;
      if (grp.length <= 6) {
        const ang = -Math.PI / 2 + 2 * Math.PI * i / grp.length;
        dx = R * Math.cos(ang); dy = R * Math.sin(ang);
      } else {
        const ang = i * 2.399963, d = gap * 0.8 * Math.sqrt(i);
        dx = d * Math.cos(ang); dy = d * Math.sin(ang);
      }
      it.e.m.setLatLng(MAP.containerPointToLatLng(L.point(cx + dx, cy + dy)));
    });
  });
}
function hoverRow(uninumbr, on) {
  const e = MAP_MARKERS.get(String(uninumbr));
  if (!e) return;
  const st = markerStyle(e.r);
  e.m.setStyle({ weight: on ? 4 : st.weight, color: on ? '#F5A623' : st.color });
  if (on) e.m.bringToFront();
}

// ── branch detail (replaces the map until "Back to map")
const normName = s => (s || '').trim().toLowerCase();
// Rate Radar row for a bank: by RSSD id when both sides have one (inst_key is bank_<rssd>),
// else by name. A name match whose row carries a different RSSD id is another bank with the
// same name (three registry banks are called First Bank), so it is refused, never shown.
function rateFor(rates, name, instKey) {
  const m = /^bank_(\d+)$/.exec(instKey || '');
  const byId = m ? rates['#' + m[1]] : null;
  if (byId) return byId;
  const row = rates[normName(name)];
  if (row && m && row.rssdid && String(row.rssdid) !== m[1]) return undefined;
  return row;
}
async function loadRates() {
  if (RATES) return RATES;
  const rows = await api('vw_rate_radar_latest', 'select=bank_name,rssdid,cd_apy,cd_term,cd_provenance,cd_verified,savings_apy,savings_provenance,savings_verified,high_yield_savings_apy,high_yield_savings_provenance,high_yield_savings_verified,money_market_apy,money_market_provenance,money_market_verified,checking_apy,checking_provenance,checking_verified,data_quality,status,run_at&order=run_at.desc&limit=2000');
  RATES = {};
  (Array.isArray(rows) ? rows : []).forEach(r => {
    const k = normName(r.bank_name); if (!RATES[k]) RATES[k] = r;
    if (r.rssdid && !RATES['#' + r.rssdid]) RATES['#' + r.rssdid] = r;
  });
  return RATES;
}
const RATE_PRODUCTS = [['cd', 'CD'], ['savings', 'Savings'], ['high_yield_savings', 'High-yield savings'], ['money_market', 'Money market'], ['checking', 'Checking']];
const AUTO_TIP = 'Read from the bank’s own page by Rate Radar and not yet confirmed by a person. The product or balance tier can be mislabelled: check the page before quoting it.';
const UNV_TIP = 'Unverified: found by web search or carried over, not read from the bank\u2019s own page. Do not quote it.';
const QUALITY_LABEL = { 'search-only': 'web search only', verified: 'verified', mixed: 'mixed sources', 'no-data': 'no data' };
function rateVal(r, key) {
  if (!r) return null;
  const v = r[key + '_apy'];
  return v === null || v === undefined || v === '' || isNaN(+v) ? null : +v;
}
function rateIsTrusted(r, key) { return rateTrusted(r[key + '_provenance'], r[key + '_verified']); }
function rateShown(r, key, showUnv) { return rateVal(r, key) !== null && (showUnv || rateIsTrusted(r, key)); }
function rateCell(r, key, showUnv) {
  const v = rateVal(r, key);
  if (v === null) return '<span class="na">\u2014</span>';
  const term = key === 'cd' && r.cd_term ? ' <span class="note">' + esc(r.cd_term) + ' mo</span>' : '';
  const lvl = rateLevel(r[key + '_provenance'], r[key + '_verified']);
  if (lvl === 'confirmed') return '<b>' + v.toFixed(2) + '%</b>' + term;
  if (lvl === 'auto') return '<b>' + v.toFixed(2) + '%</b>' + term + ' <span class="auto" title="' + esc(AUTO_TIP) + '">auto-read</span>';
  if (!showUnv) return '<span class="na">\u2014</span>';
  return '<span class="unv" title="' + esc(UNV_TIP) + '">' + v.toFixed(2) + '%' + term + ' <i>unverified</i></span>';
}
// Theirs against ours, one row per product with a verified reading on either side
// (unverified ones too when the viewer asks for them).
function ratesTable(theirs, ours, showUnv) {
  const rows = RATE_PRODUCTS.filter(([k]) => rateShown(theirs, k, showUnv) || rateShown(ours, k, showUnv));
  if (!rows.length) return '';
  return '<table class="mini rt"><thead><tr><th>Product</th><th>Theirs</th><th>Ours</th></tr></thead><tbody>' +
    rows.map(([k, label]) => '<tr><td>' + esc(label) + '</td><td>' + (theirs ? rateCell(theirs, k, showUnv) : '<span class="na">\u2014</span>') + '</td><td>' + (ours ? rateCell(ours, k, showUnv) : '<span class="na">\u2014</span>') + '</td></tr>').join('') + '</tbody></table>';
}
function backToMap(silent) {
  g('detail').classList.add('dn'); g('mapWrap').classList.remove('dn');
  if (MAP) setTimeout(() => MAP.invalidateSize(), 50);
  if (!silent) document.querySelectorAll('#rows tr.sel').forEach(t => t.classList.remove('sel'));
}
function selectBranch(uninumbr) {
  if (SELECTED !== null) hoverRow(SELECTED, false);
  SELECTED = uninumbr;
  document.querySelectorAll('#rows tr.sel').forEach(t => t.classList.remove('sel'));
  const tr = document.querySelector(`#rows tr[data-id="${String(uninumbr).replace(/"/g, '')}"]`);
  if (tr) { tr.classList.add('sel'); tr.scrollIntoView({ block: 'nearest' }); }
  hoverRow(uninumbr, true);
  renderDetail(uninumbr);
}
async function renderDetail(uninumbr) {
  const r = RANKED.find(x => String(x.uninumbr) === String(uninumbr));
  if (!r) return;
  const w = LAST_W, br = partBreakdown(r.parts, w);
  const st = STAND.get(r.uninumbr);
  const z = r.opportunity_zone || '', play = r.campaign || '', std = num(r.opportunity_score);
  const a = LAST_ALLOC ? LAST_ALLOC.amounts.get(r.uninumbr) : 0, b = LAST_ALLOC ? LAST_ALLOC.bound.get(r.uninumbr) : null;
  const inTier = LAST_ALLOC ? LAST_ALLOC.tierIds.has(r.uninumbr) : false;
  const shareText = r.excluded ? 'Head office or booking branch: left out of the goal share.'
    : (inTier ? esc(money(a || 0)) + ' \u00b7 ' + esc(capNote(r, b || null)) : 'Not in the top tier, so no share of this goal.');
  g('mapWrap').classList.add('dn');
  const d = g('detail');
  d.classList.remove('dn');
  d.innerHTML = `
    <div class="dh"><div><div class="t">${esc(cleanName(r.namebr))}</div>
      <div class="s">${esc([r.citybr, r.stalpbr].filter(Boolean).join(', '))} &middot; ${esc(money(num(r.latest_dep) || 0))} deposits &middot; goal rank #${esc(r.rank)}</div></div>
      <button type="button" class="btn teal" id="backMap">Back to map</button></div>
    <div class="dsec"><div class="chips">
      <div class="chip">Goal score<b>${r.score === null ? '—' : Math.round(r.score)}</b></div>
      <div class="chip">Standard<b>${std === null ? '—' : Math.round(std)} (#${esc(r.was)})</b></div>
      <div class="chip">Goal share<b>${r.excluded || !inTier ? '—' : esc(money(a || 0))}</b></div></div>
      <p class="note" style="margin:6px 0 0">${shareText}</p>
      ${r.partial ? '<p class="note">Some parts are missing for this branch, so the score uses the parts that exist.</p>' : ''}</div>
    <div class="dsec"><div class="label">Why</div>
      <p style="margin:0 0 6px">${esc(whyPlain(r.parts, w))}.</p>
      ${st ? '<p class="note" style="margin:0 0 6px">' + esc(st.text) + ' among the branches in view.</p>' : ''}
      <table class="mini"><thead><tr><th>Part</th><th>Value</th><th>Weight</th><th></th></tr></thead><tbody>
      ${br.map(x => `<tr><td>${esc(x.label)}</td><td>${x.value === null ? '—' : Math.round(x.value)}</td><td>${Math.round(x.weight * 100)}%</td><td style="width:40%"><div class="bar"><i style="width:${x.value === null ? 0 : Math.round(x.value)}%"></i></div></td></tr>`).join('')}
      </tbody></table></div>
    <div class="dsec"><div class="label">Play</div>
      ${play ? `<div><b>${esc(play)}</b>${z ? ' &middot; ' + esc(z) + ' zone' : ''}</div><p style="margin:4px 0 0">${esc(PLAY_MEANING[play] || ZONE_PLAIN[z] || '')}</p>` : '<p class="note">No play is stored for this branch.</p>'}
      <p class="note" style="margin:4px 0 0">${LAST_STD ? 'From the standard ranking.' : 'This is the play from the standard ranking; zone and play are not re-cut for your goals yet.'}</p></div>
    <div class="dsec"><div class="label">Nearby competitors and rates</div><div id="detailComps" class="note">Loading…</div></div>`;
  g('backMap').addEventListener('click', () => backToMap(false));

  const [comps, rates] = await Promise.all([
    api('branch_target_competitors', `my_branch_id=eq.${encodeURIComponent(uninumbr)}&select=target_namefull,target_inst_key,target_dep_m,target_rank,vuln_score&order=target_rank.asc&limit=3`),
    loadRates()
  ]);
  const box = g('detailComps');
  if (!box || String(SELECTED) !== String(uninumbr)) return;
  if (!Array.isArray(comps) || !comps.length) { box.textContent = 'No named competitors computed for this branch yet.'; return; }
  const bankName = BRANCHES[0] ? BRANCHES[0].namefull : '';
  const mine = rateFor(rates, bankName, CURRENT_IK);
  const mineAny = mine && RATE_PRODUCTS.some(([k]) => rateVal(mine, k) !== null);
  const mineTrusted = mine && RATE_PRODUCTS.some(([k]) => rateVal(mine, k) !== null && rateIsTrusted(mine, k));
  const ownNote = !mineAny ? 'No rates for ' + cleanName(bankName) + ' are in Rate Radar yet, so there is nothing to compare against.'
    : (!mineTrusted ? cleanName(bankName) + '\u2019s own rates in Rate Radar are unverified (web search only). They need the bank\u2019s own rate sheet before this comparison can be quoted.' : '');
  const unvCount = x => x ? RATE_PRODUCTS.filter(([k]) => rateVal(x, k) !== null && !rateIsTrusted(x, k)).length : 0;
  const nUnv = comps.reduce((a, c) => a + unvCount(rateFor(rates, c.target_namefull, c.target_inst_key)), 0) + unvCount(mine);
  box.className = '';
  box.innerHTML = (nUnv ? `<div style="margin-bottom:6px"><button type="button" class="linkbtn" id="toggleUnv">${SHOW_UNV ? 'Hide' : 'Show'} ${nUnv} unverified reading${nUnv === 1 ? '' : 's'}</button></div>` : '') +
    (ownNote ? '<div class="note" style="margin-bottom:6px">' + esc(ownNote) + '</div>' : '') + comps.map((c, i) => {
    const live = rateFor(rates, c.target_namefull, c.target_inst_key);
    const dep = num(c.target_dep_m);
    const tier = vulnTier(c.vuln_score);
    const liveAny = live && RATE_PRODUCTS.some(([k]) => rateVal(live, k) !== null);
    const q = live && live.data_quality ? ', ' + (QUALITY_LABEL[live.data_quality] || live.data_quality) : '';
    const tbl = liveAny ? ratesTable(live, mine, SHOW_UNV) : '';
    return `<div class="comp"><div><b>${esc(cleanName(c.target_namefull))}</b>${i === 0 ? ' <span class="ic">top rival</span>' : ''}</div>
      <div class="note">${dep !== null ? esc(money(dep * 1e6)) + ' deposits' : ''}${tier ? ' &middot; <span title="' + esc(VULN_TIP) + '">' + esc(tier) + ' vulnerability</span>' : ''}</div>
      ${liveAny ? (tbl || '<div class="note" style="margin-top:4px">No verified rates yet.</div>') + `<div class="note" style="margin-top:4px">Rate Radar ${esc(String(live.run_at || '').slice(0, 10))}${esc(q)}</div>`
      : '<div class="note" style="margin-top:4px">No Rate Radar reading for this competitor yet.</div>'}</div>`;
  }).join('') + (SHOW_UNV && nUnv ? '<div class="note">Grey readings are unverified: found by web search, not read from the bank\u2019s own page.</div>' : '');
  const tb = g('toggleUnv');
  if (tb) tb.addEventListener('click', () => {
    const top = g('detail').scrollTop;
    SHOW_UNV = !SHOW_UNV;
    renderDetail(uninumbr).then(() => { g('detail').scrollTop = top; });
  });
}

// ── events
g('rows').addEventListener('mouseover', e => { const tr = e.target.closest('tr[data-id]'); if (tr) hoverRow(tr.dataset.id, true); });
g('rows').addEventListener('mouseout', e => { const tr = e.target.closest('tr[data-id]'); if (tr && String(tr.dataset.id) !== String(SELECTED)) hoverRow(tr.dataset.id, false); });
g('rows').addEventListener('click', e => { const tr = e.target.closest('tr[data-id]'); if (tr) selectBranch(tr.dataset.id); });
g('rows').addEventListener('keydown', e => { if (e.key === 'Enter') { const tr = e.target.closest('tr[data-id]'); if (tr) selectBranch(tr.dataset.id); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !g('detail').classList.contains('dn')) backToMap(false); });
g('changeBank').addEventListener('click', () => {
  history.replaceState(null, '', location.pathname);
  g('plan').classList.add('dn'); g('changeBank').classList.add('dn'); g('pickWrap').classList.remove('dn');
  g('bankName').textContent = 'Choose a bank'; g('si').value = ''; g('results').classList.add('dn'); g('si').focus();
});
g('loginBtn').addEventListener('click', login);
g('pw').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
g('si').addEventListener('input', e => { clearTimeout(searchTimer); const q = e.target.value; searchTimer = setTimeout(() => search(q), 250); });
