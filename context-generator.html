<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Verlocity Intelligence Hub</title>
<link rel="icon" type="image/png" href="https://fggraufaro.github.io/bmap-tools/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#1a2332;--amber:#F5A623;--green:#27500A;--lgreen:#EAF3DE;--blue:#185FA5;--lblue:#E6F1FB;--red:#A32D2D;--lred:#FCEBEB;--gray:#F5F5F2;--border:#E0DED8;--text:#1a2332;--muted:#777;--white:#fff;--teal:#1D9E75;--lteal:#D4F5E9}
html,body{font-family:'Inter',system-ui,sans-serif;background:var(--gray);color:var(--text);font-size:14px}
.header{background:var(--navy);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid var(--teal)}
.logo{display:flex;align-items:center;gap:10px}
.logo-dot{width:8px;height:8px;border-radius:50%;background:var(--teal)}
.logo-text{color:#fff;font-size:14px;font-weight:700;letter-spacing:.02em}
.logo-sub{color:rgba(255,255,255,.35);font-size:10px;font-family:'IBM Plex Mono',monospace}
.logo-img{height:40px;width:auto;border-radius:0}
.live-badge{background:rgba(29,158,117,.15);border:1px solid rgba(29,158,117,.3);color:var(--teal);font-size:10px;font-family:'IBM Plex Mono',monospace;padding:3px 9px;border-radius:12px}
.radar-btn{display:inline-flex;align-items:center;gap:6px;background:var(--teal);color:#fff;font-size:10px;font-family:'IBM Plex Mono',monospace;font-weight:700;letter-spacing:.04em;padding:4px 10px;border-radius:5px;text-decoration:none;transition:opacity .2s;cursor:pointer}
.radar-btn:hover{opacity:.85}
.radar-dot{width:6px;height:6px;border-radius:50%;background:#fff;animation:radarPulse 1.8s infinite}
@keyframes radarPulse{0%,100%{opacity:1}50%{opacity:.3}}
.wrap{max-width:860px;margin:0 auto;padding:18px 16px}
.card{background:var(--white);border:1px solid var(--border);border-radius:10px;margin-bottom:14px}
.card-pad{padding:18px 20px}
.label{font-size:10px;font-weight:700;letter-spacing:.07em;color:var(--muted);text-transform:uppercase;margin-bottom:8px}
.search-row{display:flex;gap:8px}
.inp-wrap{flex:1;position:relative}
.inp{width:100%;border:1.5px solid var(--border);border-radius:7px;padding:9px 13px;font-family:'Inter',system-ui,sans-serif;font-size:13px;color:var(--text);outline:none;transition:border-color .2s;background:var(--white)}
.inp:focus{border-color:var(--navy)}
.btn{background:var(--navy);color:#fff;border:none;border-radius:7px;padding:9px 18px;font-family:'Inter',system-ui,sans-serif;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;transition:opacity .2s}
.btn:hover{opacity:.85}
.btn:disabled{opacity:.35;cursor:not-allowed}
.dd{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--white);border:1.5px solid var(--navy);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.12);z-index:999;overflow:hidden;display:none}
.dd.open{display:block}
.dd-item{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--border);transition:background .1s}
.dd-item:last-child{border-bottom:none}
.dd-item:hover,.dd-item.hi{background:#F0FBF7}
.dd-name{font-size:13px;font-weight:600;color:var(--text)}
.dd-name mark{background:#D4F5E9;border-radius:2px;padding:0 2px;font-style:normal;color:var(--text);font-weight:700}
.dd-meta{font-size:10px;font-family:'IBM Plex Mono',monospace;color:var(--muted);margin-top:2px}
.dd-msg{padding:12px 14px;font-size:11px;font-family:'IBM Plex Mono',monospace;color:var(--muted)}
.bank-hdr{background:var(--navy);padding:14px 20px;border-radius:10px 10px 0 0;display:flex;align-items:center;justify-content:space-between}
.bank-hdr-name{color:#fff;font-size:15px;font-weight:700}
.badges{display:flex;gap:6px}
.bdg{font-size:10px;font-family:'IBM Plex Mono',monospace;padding:3px 8px;border-radius:4px;font-weight:500;border:1px solid}
.bdg-g{background:rgba(39,80,10,.25);color:#8fc45a;border-color:rgba(39,80,10,.35)}
.bdg-a{background:rgba(29,158,117,.2);color:var(--teal);border-color:rgba(29,158,117,.3)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--border)}
.stat{padding:12px 16px;border-right:1px solid var(--border);text-align:center}
.stat:last-child{border-right:none}
.stat-v{font-size:18px;font-weight:800;color:var(--navy)}
.stat-l{font-size:9px;color:var(--muted);margin-top:2px;font-family:'IBM Plex Mono',monospace}
.zones{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--border)}
.zone{padding:10px;text-align:center;border-right:1px solid var(--border)}
.zone:last-child{border-right:none}
.zone-n{font-size:17px;font-weight:800}
.zone-l{font-size:9px;font-family:'IBM Plex Mono',monospace;font-weight:600;margin-top:1px}
.zi{color:var(--green)}.za{color:var(--blue)}.zd{color:#854F0B}.zj{color:var(--red)}
.branches{padding:14px 18px}
.sec-t{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.br-hdr,.br-row{display:grid;grid-template-columns:1fr 60px 70px 60px 80px;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid #f0f0ee;font-size:11px}
.br-row:last-child{border-bottom:none}
.br-hdr{font-family:'IBM Plex Mono',monospace;color:var(--muted);font-size:9px;font-weight:500}
.br-name{font-weight:600;line-height:1.2}
.br-city{font-size:10px;color:var(--muted)}
.spill{display:inline-block;padding:2px 7px;border-radius:3px;font-size:10px;font-weight:700;font-family:'IBM Plex Mono',monospace}
.sp-i{background:var(--lgreen);color:var(--green)}.sp-a{background:var(--lblue);color:var(--blue)}.sp-d{background:#FFF3E0;color:#854F0B}.sp-j{background:var(--lred);color:var(--red)}
.target-sec{padding:0 18px 14px}
.target-box{background:var(--gray);border:1px solid var(--border);border-radius:7px;padding:10px 14px}
.target-name{font-size:13px;font-weight:700;color:var(--red)}
.target-meta{font-size:10px;font-family:'IBM Plex Mono',monospace;color:var(--muted);margin-top:3px;line-height:1.5}
.wf-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
.wf{background:var(--white);border:1.5px solid var(--border);border-radius:10px;padding:14px;cursor:pointer;transition:all .18s;position:relative}
.wf::before{content:'';position:absolute;top:0;left:0;width:3px;height:100%;border-radius:10px 0 0 10px;background:var(--border);transition:background .18s}
.wf:hover,.wf.on{border-color:var(--teal)}
.wf:hover::before,.wf.on::before{background:var(--teal)}
.wf-n{font-size:9px;font-family:'IBM Plex Mono',monospace;color:var(--muted);margin-bottom:5px}
.wf-t{font-size:13px;font-weight:700;margin-bottom:3px}
.wf-d{font-size:11px;color:var(--muted);line-height:1.4}
.wf-tag{display:inline-block;margin-top:6px;font-size:9px;font-family:'IBM Plex Mono',monospace;padding:2px 6px;border-radius:3px;background:var(--gray);color:var(--muted);border:1px solid var(--border)}
.gen-btn{width:100%;background:var(--teal);color:#fff;border:none;border-radius:9px;padding:13px;font-family:'Inter',system-ui,sans-serif;font-size:14px;font-weight:800;cursor:pointer;margin-bottom:14px;transition:opacity .2s}
.gen-btn:hover{opacity:.9}
.gen-btn:disabled{opacity:.35;cursor:not-allowed}
.out-card{background:var(--white);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.out-hdr{background:var(--gray);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;align-items:center;justify-content:space-between}
.out-t{font-size:11px;font-weight:700;font-family:'IBM Plex Mono',monospace}
.copy-btn{background:var(--navy);color:#fff;border:none;border-radius:5px;padding:5px 12px;font-size:10px;font-family:'IBM Plex Mono',monospace;font-weight:700;cursor:pointer;transition:opacity .2s}
.copy-btn:hover{opacity:.8}
.copy-btn.ok{background:var(--green)}
.out-body{padding:16px;max-height:380px;overflow-y:auto}
.out-txt{font-family:'IBM Plex Mono',monospace;font-size:10.5px;line-height:1.9;color:var(--text);white-space:pre-wrap;word-break:break-word}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--navy);border-radius:50%;animation:sp .8s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
.loading{display:none;text-align:center;padding:16px;font-size:11px;font-family:'IBM Plex Mono',monospace;color:var(--muted)}
.loading.on{display:block}
.dn{display:none}

/* ── WF02 AUDIENCE GENERATOR ── */
.ag-section{background:var(--white);border:1px solid var(--border);border-radius:10px;margin-bottom:14px;overflow:hidden}
.ag-sec-hdr{background:#F0EEE8;padding:8px 16px;font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;justify-content:space-between}
.ag-sec-body{padding:14px 16px}
.ag-input-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:10px}
.ag-field{display:flex;flex-direction:column;gap:4px}
.ag-field label{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.ag-field select{padding:7px 10px;border:1.5px solid var(--border);border-radius:7px;font-size:13px;background:var(--white);color:var(--text);font-family:'Inter',system-ui,sans-serif}
.ag-field select:focus{border-color:var(--navy);outline:none}
.ag-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.ag-scard{background:var(--gray);border-radius:7px;padding:9px 12px}
.ag-scard-l{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px;font-family:'IBM Plex Mono',monospace}
.ag-scard-v{font-size:17px;font-weight:800;color:var(--navy)}
.ag-scard-v.good{color:var(--green)}.ag-scard-v.warn{color:#854F0B}.ag-scard-v.bad{color:var(--red)}
.ag-seg-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ag-seg{border-radius:8px;padding:12px 14px;border:1px solid var(--border);background:var(--white)}
.ag-seg.primary{background:var(--lblue);border-color:#378ADD}
.ag-seg.secondary{background:var(--lteal);border-color:var(--teal)}
.ag-seg.off{opacity:.32}
.ag-badge{display:inline-block;font-size:9px;font-weight:700;padding:2px 7px;border-radius:99px;margin-bottom:5px;letter-spacing:.04em;font-family:'IBM Plex Mono',monospace}
.ag-badge.bp{background:#B5D4F4;color:#0C447C}
.ag-badge.bs{background:#9FE1CB;color:#085041}
.ag-badge.bo{background:var(--gray);color:var(--muted);border:1px solid var(--border)}
.ag-seg-name{font-size:12px;font-weight:700;margin-bottom:2px}
.ag-seg.primary .ag-seg-name{color:#0C447C}
.ag-seg.secondary .ag-seg-name{color:#085041}
.ag-seg-desc{font-size:11px;color:var(--muted);margin-bottom:4px}
.ag-seg.primary .ag-seg-desc{color:#185FA5}
.ag-seg.secondary .ag-seg-desc{color:var(--teal)}
.ag-seg-why{font-size:11px;color:var(--muted);font-style:italic;line-height:1.4}
.ag-seg.primary .ag-seg-why{color:#185FA5}
.ag-seg.secondary .ag-seg-why{color:var(--teal)}
.ag-rai{margin-top:7px;padding:6px 8px;background:rgba(0,0,0,.04);border-radius:5px;font-size:10px;line-height:1.5;font-family:'IBM Plex Mono',monospace}
.ag-seg.primary .ag-rai{background:rgba(12,68,124,.07);color:#0C447C}
.ag-seg.secondary .ag-rai{background:rgba(15,110,86,.07);color:#085041}
.ag-rai-lbl{font-weight:700;font-size:9px;letter-spacing:.05em;text-transform:uppercase;display:block;margin-bottom:2px;opacity:.7}
.ag-params-toggle{margin-top:6px;font-size:10px;cursor:pointer;display:inline-flex;align-items:center;gap:4px;opacity:.6;font-family:'IBM Plex Mono',monospace;user-select:none}
.ag-params-toggle:hover{opacity:1}
.ag-params-body{display:none;margin-top:6px;border-top:1px solid rgba(0,0,0,.08);padding-top:6px}
.ag-params-body.open{display:block}
.ag-param-row{display:flex;gap:6px;font-size:10px;font-family:'IBM Plex Mono',monospace;padding:2px 0;line-height:1.4}
.ag-param-k{color:var(--muted);flex-shrink:0;min-width:120px}
.ag-seg.primary .ag-param-k{color:#185FA5;opacity:.7}
.ag-seg.secondary .ag-param-k{color:#0F6E56;opacity:.7}
.ag-param-v{font-weight:500;color:var(--navy)}
.ag-seg.primary .ag-param-v{color:#0C447C}
.ag-seg.secondary .ag-param-v{color:#085041}
.ag-smb-pill{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;font-family:'IBM Plex Mono',monospace}
.ag-smb-top{background:#9FE1CB;color:#04342C}.ag-smb-high{background:#C0DD97;color:#173404}
.ag-smb-medium{background:#FAC775;color:#412402}.ag-smb-low{background:#D3D1C7;color:#444}
.ag-gen-btn{width:100%;background:var(--teal);color:#fff;border:none;border-radius:9px;padding:13px;font-family:'Inter',system-ui,sans-serif;font-size:14px;font-weight:800;cursor:pointer;margin-bottom:14px;transition:opacity .2s}
.ag-gen-btn:hover{opacity:.88}
.ag-gen-btn:disabled{opacity:.35;cursor:not-allowed}
.ag-note{font-size:10px;color:var(--muted);font-style:italic;margin-top:8px;font-family:'IBM Plex Mono',monospace}

/* ── WF06 PPT NARRATIVE ── */
.ppt-tone-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.ppt-tone{background:var(--white);border:1.5px solid var(--border);border-radius:8px;padding:12px 14px;cursor:pointer;transition:all .15s;position:relative}
.ppt-tone::before{content:'';position:absolute;top:0;left:0;width:3px;height:100%;border-radius:8px 0 0 8px;background:var(--border);transition:background .15s}
.ppt-tone.on{border-color:var(--teal);background:#F0FBF7}
.ppt-tone.on::before{background:var(--teal)}
.ppt-tone-title{font-size:12px;font-weight:700;margin-bottom:3px}
.ppt-tone-desc{font-size:11px;color:var(--muted);line-height:1.5}
.ppt-slides{display:flex;flex-direction:column;gap:12px;margin-bottom:14px}
.ppt-slide{background:var(--white);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.ppt-slide-hdr{background:var(--navy);padding:10px 16px;display:flex;align-items:center;gap:10px}
.ppt-slide-num{font-size:9px;font-family:'IBM Plex Mono',monospace;color:rgba(255,255,255,.4);letter-spacing:.08em;flex-shrink:0}
.ppt-slide-label{font-size:12px;font-weight:700;color:#fff;flex:1}
.ppt-copy-slide{background:rgba(29,158,117,.2);border:1px solid rgba(29,158,117,.4);color:var(--teal);font-size:10px;font-family:'IBM Plex Mono',monospace;font-weight:700;padding:3px 10px;border-radius:5px;cursor:pointer;transition:opacity .2s}
.ppt-copy-slide:hover{background:rgba(29,158,117,.35)}
.ppt-copy-slide.ok{background:rgba(39,80,10,.2);border-color:rgba(39,80,10,.4);color:var(--green)}
.ppt-slide-body{padding:16px 18px}
.ppt-headline{font-size:19px;font-weight:800;color:var(--navy);line-height:1.25;margin-bottom:9px;letter-spacing:-.01em}
.ppt-intro{font-size:12px;color:#444;line-height:1.75;margin-bottom:12px;font-style:italic;border-left:3px solid var(--teal);padding-left:11px}
.ppt-bullets{margin-bottom:12px}
.ppt-bullet{display:flex;gap:9px;margin-bottom:7px;font-size:12px;line-height:1.65}
.ppt-bullet-dot{width:6px;height:6px;border-radius:50%;background:var(--teal);flex-shrink:0;margin-top:6px}
.ppt-close{font-size:12px;font-weight:700;color:var(--navy);background:var(--gray);border-radius:6px;padding:9px 13px;border-left:3px solid var(--navy)}
.ppt-copy-all{width:100%;background:var(--navy);color:#fff;border:none;border-radius:8px;padding:12px;font-size:13px;font-weight:700;cursor:pointer;transition:opacity .15s;margin-bottom:14px}
.ppt-copy-all:hover{opacity:.88}
.ppt-copy-all.ok{background:var(--green)}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://fggraufaro.github.io/bmap-tools/bmap-deck.js"></script>
</head>
<body>
<!-- Auth Gate -->
<div id="authGate" style="display:flex;position:fixed;inset:0;background:#1a2332;z-index:9999;flex-direction:column;align-items:center;justify-content:center;gap:16px">
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
    <img src="https://fggraufaro.github.io/bmap-tools/Verlocity-Logo.png" alt="Verlocity" style="height:72px;width:auto;border-radius:14px;background:#fff;padding:8px 16px" onerror="this.style.display='none'">
  </div>
  <div style="background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:28px 32px;width:320px;text-align:center">
    <div style="color:rgba(255,255,255,.5);font-size:11px;font-family:monospace;margin-bottom:14px;letter-spacing:.05em">ENTER ACCESS CODE</div>
    <input id="tokenInput" type="password" placeholder="••••••••••••"
      style="width:100%;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.15);border-radius:7px;padding:10px 14px;color:#fff;font-family:monospace;font-size:14px;outline:none;text-align:center"
      onkeydown="if(event.key==='Enter')checkAccess()">
    <div id="authErr" style="display:none;color:#1D9E75;font-size:11px;font-family:monospace;margin-bottom:10px">Incorrect code — try again</div>
    <button onclick="checkAccess()" style="width:100%;background:#1D9E75;color:#fff;border:none;border-radius:7px;padding:10px;font-size:13px;font-weight:800;cursor:pointer;letter-spacing:.02em;margin-top:12px">ACCESS</button>
  </div>
</div>

<div id="appWrap" style="display:none">

<div class="header">
  <div style="display:flex;align-items:center;gap:16px">
    <div class="logo" style="background:#fff;padding:4px 10px;border-radius:10px">
      <img class="logo-img" src="https://fggraufaro.github.io/bmap-tools/Verlocity-Logo.png" alt="Verlocity" style="background:transparent;mix-blend-mode:normal" onerror="document.getElementById('logoFallback').style.display='flex'">
      <div id="logoFallback" style="display:none;align-items:center;gap:10px">
        <div class="logo-dot"></div>
        <div><div class="logo-text">Verlocity Intelligence Hub</div><div class="logo-sub">Verlocity</div></div>
      </div>
    </div>
    <div style="display:flex;flex-direction:column;gap:2px">
      <div style="color:#fff;font-size:15px;font-weight:700;letter-spacing:.01em;font-family:'Inter',system-ui,sans-serif">Verlocity Intelligence Hub</div>
      <div style="color:rgba(255,255,255,.35);font-size:10px;font-family:'IBM Plex Mono',monospace;letter-spacing:.06em;text-transform:uppercase">Verlocity · BMAP Intelligence</div>
    </div>
  </div>
  <div style="display:flex;align-items:center;gap:12px">
    <a href="rate-radar.html" class="radar-btn" title="Open Rate Radar"><span class="radar-dot"></span>Rate Radar →</a>
    <div class="live-badge">LIVE · Supabase</div>
  </div>
</div>

<div class="wrap">
  <!-- Content will be loaded by bmap-deck.js -->
</div>

</div>

<script>
// ── ACCESS CONTROL ─────────────────────────────────────────────
const ACCESS_TOKEN = 'verlocity2026';

function checkAccess() {
  const input = document.getElementById('tokenInput');
  const code = input.value.trim();
  const authErr = document.getElementById('authErr');
  
  if (code === ACCESS_TOKEN) {
    // Valid code - show app, hide auth gate
    sessionStorage.setItem('bmap_access', ACCESS_TOKEN);
    document.getElementById('authGate').style.display = 'none';
    document.getElementById('appWrap').style.display = 'block';
  } else {
    // Invalid code - show error
    authErr.style.display = 'block';
    input.value = '';
    input.focus();
    
    // Auto-hide error after 3 seconds
    setTimeout(() => {
      authErr.style.display = 'none';
    }, 3000);
  }
}

// Check if already authenticated on page load
document.addEventListener('DOMContentLoaded', function() {
  const stored = sessionStorage.getItem('bmap_access');
  if (stored === ACCESS_TOKEN) {
    document.getElementById('authGate').style.display = 'none';
    document.getElementById('appWrap').style.display = 'block';
  } else {
    document.getElementById('tokenInput').focus();
  }
});
</script>

</body>
</html>
