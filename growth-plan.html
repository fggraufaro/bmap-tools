<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Verlocity Growth Plan</title>
<link rel="icon" type="image/png" href="https://fggraufaro.github.io/bmap-tools/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--navy:#083D5F;--teal:#02A7C2;--amber:#F5A623;--green:#27500A;--lgreen:#EAF3DE;--blue:#185FA5;--lblue:#E6F1FB;--red:#A32D2D;--lred:#FCEBEB;--gray:#F5F5F2;--border:#E0DED8;--text:#213141;--muted:#777;--white:#fff}
  *{box-sizing:border-box}
  html,body{margin:0;font-family:'Inter',system-ui,sans-serif;font-weight:400;background:var(--gray);color:var(--text);font-size:14px;line-height:1.4}
  b,strong{font-weight:700}
  .dn{display:none!important}
  .header{background:var(--navy);padding:5px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid var(--teal);gap:12px;flex-wrap:wrap}
  .logo{background:#fff;padding:3px 9px;border-radius:9px;display:flex;align-items:center;flex-shrink:0}
  .logo img{height:30px;width:auto;display:block;flex-shrink:0;max-width:none}
  .htitle{color:#fff;font-size:15px;font-weight:700}
  .hsub{color:rgba(255,255,255,.45);font-size:10px;letter-spacing:.06em;text-transform:uppercase}
  .live-badge{background:rgba(2,167,194,.15);border:1px solid rgba(2,167,194,.3);color:var(--teal);font-size:12px;padding:3px 10px;border-radius:12px}
  .btn{background:var(--navy);color:#fff;border:none;border-radius:7px;height:32px;padding:0 14px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
  .btn.teal{background:var(--teal)}
  /* goal bar */
  .gbar{background:#fff;border-bottom:1px solid var(--border);padding:5px 20px;display:flex;flex-wrap:wrap;gap:10px 12px;align-items:flex-end}
  .gsel{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1 1 150px;max-width:230px}
  .gsel .gl{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
  .gsel select,.gsel input{height:32px;border:1.5px solid var(--border);border-radius:7px;font-family:inherit;font-size:13px;color:var(--text);padding:0 8px;min-width:0;width:100%;background:#fff;outline:none}
  .gsel select:focus,.gsel input:focus{border-color:var(--navy)}
  .gsel.sugg select{border-color:var(--teal)}
  .stag{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;background:var(--amber);color:var(--navy);border-radius:4px;padding:1px 5px}
  /* cards */
  main{padding:8px 20px 12px}
  .strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:10px}
  .card{background:var(--white);border:1px solid var(--border);border-radius:10px;padding:10px 14px;min-width:0}
  .strip .card{display:flex;flex-direction:column;gap:0;overflow:hidden;padding:6px 12px}
  .strip .hrow{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .strip h3{margin:0;font-size:10px;font-weight:700;letter-spacing:.07em;color:var(--muted);text-transform:uppercase}
  .strip .big{font-size:clamp(20px,2vw,32px);font-weight:800;color:var(--navy);line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .strip .warn{color:var(--red)}
  .strip .line{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .strip .more{align-self:flex-start;background:none;border:0;padding:0;color:var(--blue);font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;text-decoration:underline}
  #allMetrics{margin-bottom:10px}
  .label{font-size:10px;font-weight:700;letter-spacing:.07em;color:var(--muted);text-transform:uppercase;margin-bottom:6px}
  /* work area */
  .work{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:12px;height:max(460px,calc(100vh - 212px));align-items:stretch}
  .tablecard,.rightcol{height:100%;min-height:0;min-width:0;display:flex;flex-direction:column;overflow:hidden;padding:0}
  .thead{padding:8px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .thead h2{margin:0;font-size:14px;font-weight:700;color:var(--navy)}
  .mode{font-size:11px;background:#FFF8E8;border:1px solid var(--amber);border-radius:6px;padding:2px 8px}
  .tscroll{flex:1;overflow-y:auto;overflow-x:hidden}
  table{width:100%;border-collapse:collapse;table-layout:fixed}
  th{position:sticky;top:0;z-index:1;font-size:10px;font-weight:700;letter-spacing:.05em;color:var(--muted);text-transform:uppercase;text-align:left;padding:0 8px;height:30px;background:#f5f4f0;border-bottom:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  td{height:40px;padding:0 8px;border-bottom:1px solid #f0efe8;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
  tbody tr{cursor:pointer}
  tbody tr:hover td{background:var(--lblue)}
  tr.top td{background:#f1f9fb}
  tr.sel td{background:#FFF3D6!important}
  th.k-rk{width:46px}th.k-dep{width:78px}th.k-score{width:60px}th.k-std{width:82px}th.k-zp{width:168px}th.k-share{width:96px}th.k-why{width:26%}
  .rk{display:inline-block;min-width:24px;height:24px;line-height:24px;text-align:center;border-radius:12px;font-weight:700;font-size:12px}
  .rk.t5{background:var(--teal);color:#fff}
  .nm{font-weight:700;color:var(--text)}
  .ct{color:var(--muted);font-weight:400}
  .ic{display:inline-block;margin-left:5px;font-size:9px;font-weight:700;border-radius:4px;padding:1px 4px;background:#FBF0DF;color:#854F0B;vertical-align:1px}
  .zone{display:inline-block;padding:1px 7px;border-radius:4px;font-size:11px;font-weight:700;background:#f0efe8;color:var(--muted);white-space:nowrap}
  .zone.Invest{background:var(--lgreen);color:var(--green)}.zone.Analyze{background:var(--lblue);color:var(--blue)}.zone.Defend{background:#FBF0DF;color:#854F0B}.zone.Justify{background:var(--lred);color:var(--red)}
  .play{font-size:12px;color:var(--text);margin-left:4px}
  .up{color:var(--green);font-weight:700}.down{color:var(--red);font-weight:700}
  .why{color:var(--muted);font-size:12px}
  .note{font-size:12px;color:var(--muted)}
  .foot{padding:5px 14px;border-top:1px solid var(--border);font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* map and detail */
  #mapWrap{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
  #map{flex:1;min-height:0;width:100%;position:relative;z-index:0;background:#e8eef2}
  .maplegend{display:flex;flex-wrap:wrap;gap:4px 12px;padding:6px 12px;border-top:1px solid var(--border);font-size:11px;color:var(--muted);align-items:center}
  .maplegend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
  .leaflet-tooltip.rkt{background:transparent;border:0;box-shadow:none;color:#fff;font-weight:800;font-size:11px;padding:0}
  .leaflet-tooltip.rkt::before{display:none}
  #detail{flex:1;min-height:0;overflow-y:auto}
  .dh{background:var(--navy);color:#fff;padding:10px 14px;position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
  .dh .t{font-size:15px;font-weight:700}
  .dh .s{font-size:12px;color:rgba(255,255,255,.65);margin-top:2px}
  .dsec{padding:10px 14px;border-bottom:1px solid var(--border)}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{background:var(--gray);border:1px solid var(--border);border-radius:7px;padding:5px 9px;font-size:11px}
  .chip b{display:block;font-size:15px;color:var(--navy)}
  .bar{height:8px;background:#f0efe8;border-radius:4px;overflow:hidden;min-width:60px}
  .bar i{display:block;height:100%;background:var(--teal)}
  table.mini{table-layout:auto}
  table.mini th,table.mini td{height:auto;padding:4px 6px;font-size:12px;position:static;white-space:normal}
  .comp{border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin-bottom:8px}
  .rate{display:inline-block;background:var(--lblue);color:var(--blue);border-radius:5px;padding:2px 7px;font-size:11px;margin:4px 4px 0 0}
  .rate.bank{background:var(--lgreen);color:var(--green)}
  /* gate and search */
  input[type=text],input[type=email],input[type=password]{width:100%;border:1.5px solid var(--border);border-radius:7px;padding:8px 12px;font-family:inherit;font-size:13px;color:var(--text);outline:none;background:#fff}
  #gate{position:fixed;inset:0;background:var(--navy);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
  #gate .box{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:28px 32px;width:320px;text-align:center}
  #gate .lab{color:rgba(255,255,255,.5);font-size:11px;margin-bottom:14px;letter-spacing:.05em}
  #gate input{background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.15);color:#fff;margin-bottom:10px}
  #gate button{width:100%;background:var(--teal);color:#fff;border:0;border-radius:7px;font-weight:800;font-size:13px;padding:10px;cursor:pointer;font-family:inherit}
  .err{color:var(--teal);font-size:11px;margin-top:8px}
  #results{border:1.5px solid var(--navy);border-radius:8px;background:#fff;margin-top:6px;box-shadow:0 8px 24px rgba(0,0,0,.12);overflow:hidden}
  #results button{display:block;width:100%;text-align:left;padding:9px 14px;border:0;border-bottom:1px solid var(--border);background:#fff;font-family:inherit;font-size:13px;cursor:pointer}
  #results button:hover{background:var(--lblue)}
  @media (max-width:1400px){th.k-why,td.c-why{display:none}}
  @media (max-width:1100px){.work{display:block;height:auto}.tablecard{height:auto}.tscroll{max-height:62vh}.rightcol{height:430px;margin-top:12px}}
  @media (max-width:999px){.strip{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>

<body>

<div id="gate">
  <div class="logo"><img src="verlocity-logo.jpg" alt="Verlocity"></div>
  <div class="box">
    <div class="lab">LOG IN &middot; GROWTH PLAN (INTERNAL DRAFT)</div>
    <input id="em" type="email" placeholder="you@verlocity.ai" autocomplete="username" aria-label="Email">
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password" aria-label="Password">
    <div id="gateErr" class="err dn" role="alert"></div>
    <button id="loginBtn" type="button">Sign in</button>
  </div>
</div>

<div id="app" class="dn">
  <div class="header">
    <div style="display:flex;align-items:center;gap:14px">
      <div class="logo"><img src="verlocity-logo.jpg" alt="Verlocity"></div>
      <div style="display:flex;flex-direction:column;gap:1px">
        <div class="htitle">Verlocity Growth Plan</div>
        <div class="hsub">Verlocity &middot; BMAP Intelligence &middot; Internal draft</div>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:10px">
      <span class="live-badge" id="bankName">Choose a bank</span>
      <button type="button" id="changeBank" class="btn teal dn">Change bank</button>
    </div>
  </div>

  <div id="pickWrap" style="padding:14px 20px">
    <div class="card" id="pickCard">
      <div class="label">Choose a bank</div>
      <input type="text" id="si" placeholder="Start typing a bank name" aria-label="Search institutions" autocomplete="off">
      <div id="results" class="dn"></div>
    </div>
  </div>

  <div id="plan" class="dn">
    <div class="gbar" id="gbar" aria-label="Set your goals"></div>
    <main>
      <div class="strip" id="strip"></div>
      <div class="card dn" id="allMetrics"></div>
      <div class="work">
        <div class="card tablecard">
          <div class="thead"><h2>Branches ranked for these goals</h2><span class="mode" id="mode"></span></div>
          <div class="tscroll"><table class="rank">
            <thead><tr id="thead"></tr></thead>
            <tbody id="rows"></tbody>
          </table></div>
          <div class="foot" id="foot"></div>
        </div>
        <div class="card rightcol">
          <div id="mapWrap">
            <div id="map" role="img" aria-label="Map of the bank's branches, sized by deposits and colored by goal rank"></div>
            <div class="maplegend">
              <span><i style="background:#02A7C2"></i>Rank 1 to 5</span>
              <span><i style="background:#185FA5"></i>6 to 15</span>
              <span><i style="background:#8B93A0"></i>Others</span>
              <span><i style="background:#fff;border:2px dashed #854F0B"></i>Head office / booking</span>
            </div>
          </div>
          <div id="detail" class="dn"></div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>

<script>
// ───────────────────────── pure scoring (no DOM) ─────────────────────────
// Weights are a DRAFT: pending confirmation by Brock and Marc. Parts are 0-100.
// Wealth and community each move 30 points to a new part; take-share moves 15;
// the objective and product adjustments add up to 25 more before rescaling.
const FOCUS = {
  core:      { mg: 25, rg: 30, id: 25, ds: 20 },
  wealth:    { mg: 18, rg: 21, id: 17, ds: 14, wl: 30 },
  community: { mg: 18, rg: 21, id: 17, ds: 14, lm: 30 },
  share:     { mg: 15, rg: 40, id: 30, ds: 15 }
};
const OBJECTIVE = { cost: { sb: 15, ds: 10 }, liquidity: { mg: 10, id: 10 }, loans: { mg: 15, sb: 5 }, ltd: { mg: 5, id: 10, sb: 5 } };
const PRODUCT = { checking: { sb: 5, mg: 5 }, cd: { rg: 5 }, mm: { wl: 5 }, wealth: { wl: 10 } };
const PART_KEYS = ['mg', 'rg', 'id', 'ds', 'wl', 'lm', 'sb'];
const PART_LABEL = { mg: 'Market growth', rg: 'Winning vs. rivals', id: 'Room to grow', ds: 'Deposit base', wl: 'Wealth', lm: 'Lower-income reach', sb: 'Small-business density' };
const MIN_COVERAGE = 0.5;   // a branch needs at least half the weight present to be scored
const CAP_FRACTION = 0.25;  // goal share per branch is capped at 25% of its deposits

function weightsFor(focus, objective, product) {
  const w = {}; PART_KEYS.forEach(k => { w[k] = 0; });
  [FOCUS[focus] || FOCUS.core, OBJECTIVE[objective] || {}, PRODUCT[product] || {}]
    .forEach(d => { for (const k in d) w[k] += d[k]; });
  let t = 0; PART_KEYS.forEach(k => { t += w[k]; });
  PART_KEYS.forEach(k => { w[k] = w[k] / t; });
  return w;
}
const num = v => (v === null || v === undefined || v === '' || isNaN(+v)) ? null : +v;

// Percentile (0-100) of v among the non-null values of a list (fallback).
function percentiles(values) {
  const present = values.filter(v => v !== null).sort((a, b) => a - b);
  const n = present.length;
  return values.map(v => {
    if (v === null || n === 0) return null;
    let less = 0, eq = 0;
    for (const p of present) { if (p < v) less++; else if (p === v) eq++; }
    return 100 * (less + 0.5 * eq) / n;
  });
}
// Percentile of v from 21 breakpoints (0,5,...,100th percentile of the state).
function pctFromBreaks(v, bp) {
  if (v === null || !bp || bp.length !== 21) return null;
  if (v <= bp[0]) return 0;
  if (v >= bp[20]) return 100;
  for (let i = 0; i < 20; i++) {
    if (v >= bp[i] && v < bp[i + 1]) {
      const span = bp[i + 1] - bp[i];
      return span > 0 ? 5 * i + 5 * (v - bp[i]) / span : 5 * i;
    }
  }
  return null;
}

// Branch parts. mg, rg, id, ds are the stored normalized columns. wl and sb are
// percentiles WITHIN THE STATE (breakpoints from bank branches in that state);
// a state with too few branches falls back to the bank's own branches.
function withParts(branches, breaks) {
  const inc = branches.map(b => num(b.household_income));
  const smb = branches.map(b => num(b.smb_index));
  const incFallback = percentiles(inc), smbFallback = percentiles(smb);
  return branches.map((b, i) => {
    const st = breaks && breaks.states && breaks.states[b.stalpbr];
    const wl = st ? pctFromBreaks(inc[i], st.inc) : incFallback[i];
    const sb = st ? pctFromBreaks(smb[i], st.smb) : smbFallback[i];
    return { ...b, statewide: !!st, parts: {
      mg: num(b.market_growth_normalized), rg: num(b.rel_growth_norm),
      id: num(b.inv_density_norm_winsor), ds: num(b.deposit_size_norm),
      wl, lm: wl === null ? null : 100 - wl, sb } };
  });
}

// Score one branch. Missing parts are skipped and the weights that remain are
// rescaled, so a new branch with no growth history is not penalized; it is
// tagged "partial data". Less than MIN_COVERAGE of the weight present: no score.
function scoreBranch(parts, w) {
  let s = 0, present = 0, total = 0, missing = false;
  for (const k of PART_KEYS) {
    if (w[k] <= 0) continue;
    total += w[k];
    if (parts[k] === null) { missing = true; continue; }
    s += w[k] * parts[k]; present += w[k];
  }
  if (total === 0 || present / total < MIN_COVERAGE) return { score: null, partial: true };
  return { score: s / present, partial: missing };
}

function median(a) { const s = a.filter(v => v !== null).sort((x, y) => x - y); const n = s.length; return n ? (n % 2 ? s[(n - 1) / 2] : (s[n / 2 - 1] + s[n / 2]) / 2) : null; }

function rankBranches(branches, answers, breaks) {
  const w = weightsFor(answers.focus, answers.objective, answers.product);
  const prepared = withParts(branches, breaks).map(b => ({ ...b, ...scoreBranch(b.parts, w) }));
  const byGoal = prepared.slice().sort((a, b) => (a.score === null) - (b.score === null) || b.score - a.score);
  const byStd = prepared.slice().sort((a, b) => (num(a.opportunity_score) === null) - (num(b.opportunity_score) === null) || num(b.opportunity_score) - num(a.opportunity_score));
  const stdRank = new Map(); byStd.forEach((b, i) => stdRank.set(b.uninumbr, i + 1));
  const med = median(prepared.map(b => num(b.latest_dep)));
  // Head office or booking branches: deposits above 10x the bank's median branch.
  const rows = byGoal.map((b, i) => ({ ...b, rank: i + 1, was: stdRank.get(b.uninumbr), excluded: med !== null && num(b.latest_dep) > 10 * med }));
  // Cluster flag: a branch in the same city as a better-ranked one in the top 15.
  const seen = new Map();
  rows.slice(0, 15).forEach(r => {
    const key = [r.citybr, r.stalpbr].join('|').toLowerCase();
    if (seen.has(key)) r.sameMarketAs = seen.get(key); else seen.set(key, r.rank);
  });
  return { w, rows };
}

// ── Campaign goal logic (draft, for Brock and Marc to confirm) ──
// The goal is ADDITIONAL deposits from the campaign, on top of normal organic growth.
// It is placed on the top tier only, in proportion to score, and each branch is
// limited to the lower of 10% of its own deposits or 1.5% of the deposits within
// 10 miles; the constraint that binds is reported.
const TIER_SHARE = 0.25, TIER_MIN = 5, TIER_MAX = 40;
const GOAL_PCT = { low: 0.03, mid: 0.05, high: 0.08 };
const CAP_BRANCH = 0.10, CAP_MARKET = 0.015;
const fmtM = v => v >= 1000 ? '$' + (v / 1000).toFixed(1) + 'B' : '$' + Math.round(v) + 'M';
const roundTo = (v, step) => Math.max(step, Math.round(v / step) * step);

// The top tier: the best quarter of scored branches by goal score (5 to 40), head offices out.
function tierOf(rows) {
  const el = rows.filter(r => r.score !== null && !r.excluded);
  const n = Math.min(TIER_MAX, Math.max(TIER_MIN, Math.round(el.length * TIER_SHARE)));
  return el.slice(0, n);
}
function goalRange(rows) {
  const t = tierOf(rows);
  const dep = t.reduce((a, r) => a + (num(r.latest_dep) || 0), 0);
  const m = v => roundTo(v / 1e6, 25);
  return { tierCount: t.length, tierDep: dep,
    low: m(GOAL_PCT.low * dep), mid: m(GOAL_PCT.mid * dep), high: m(GOAL_PCT.high * dep), stretch: m(2 * GOAL_PCT.high * dep) };
}
function capFor(r) {
  const dep = num(r.latest_dep) || 0, mkt = num(r.total_deposits_10mi);
  const byBranch = CAP_BRANCH * dep;
  const byMarket = mkt !== null && mkt > 0 ? CAP_MARKET * mkt : Infinity;
  return byMarket < byBranch ? { cap: byMarket, by: 'market' } : { cap: byBranch, by: 'branch' };
}
// Water-filling: split the goal over the tier by score, capping each branch.
function allocate(rows, goalDollars) {
  const tier = tierOf(rows);
  const amounts = new Map(), bound = new Map();
  rows.forEach(r => amounts.set(r.uninumbr, 0));
  let active = tier.filter(r => num(r.latest_dep) > 0).map(r => ({ r, ...capFor(r), got: 0 }));
  const capacity = active.reduce((a, x) => a + x.cap, 0);
  let rem = goalDollars;
  for (let it = 0; it < 40 && active.length && rem > 1; it++) {
    const tot = active.reduce((a, x) => a + x.r.score, 0);
    if (tot <= 0) break;
    const over = active.filter(x => x.got + rem * x.r.score / tot > x.cap);
    if (!over.length) { active.forEach(x => { x.got += rem * x.r.score / tot; amounts.set(x.r.uninumbr, x.got); }); rem = 0; break; }
    let used = 0;

      <table class="mini"><thead><tr><th></th><th>Bank</th><th>Peers</th><th>Gap</th></tr></thead><tbody>${lines}</tbody></table>
      <div class="note" style="margin-top:6px">Peers: median of ${esc(String(peer.n))} banks with ${esc((PEERS.labels || {})[band] || '')} in assets, quarter ${esc(String(BANK_FIN.period || ''))}. Draft; the peer group is for Brock to confirm.</div></div>
    <div style="flex:1 1 300px;min-width:0"><div class="label">Suggested objective</div>
      <div><b>${esc(sug ? names[sug.key] : '—')}</b></div><div class="note">${esc(sug ? sug.why : '')}</div>
      ${imp ? `<div class="label" style="margin-top:10px">Funding impact of this goal</div><div><b>${esc(imp.title)}: ${esc(imp.main)}</b></div><div class="note">${esc(imp.note)}</div>` : ''}</div></div>`;
}

// ── render
function render() {
  const sugg = currentSuggestions();
  const scope = answers.market === 'all' ? BRANCHES : BRANCHES.filter(b => b.stalpbr === answers.market);
  const { w, rows } = rankBranches(scope, answers, BREAKS);
  const range = goalRange(rows);
  renderGoalBar(sugg, range);
  RANKED = rows; LAST_W = w;
  const isStandard = answers.focus === 'core' && answers.objective === 'none' && answers.product === 'none';
  LAST_STD = isStandard;
  const goalDollars = goalFor(range);
  const al = allocate(rows, goalDollars);
  LAST_ALLOC = al;
  drawMap(rows, (BRANCHES[0] ? BRANCHES[0].uninumbr : 0) + '|' + answers.market);

  const totalDep = scope.reduce((a, b) => a + (num(b.latest_dep) || 0), 0);
  const peerRow = PEERS && PEERS.bands && BANK_FIN ? PEERS.bands[peerBand(num(BANK_FIN.total_assets))] : null;
  const bankDep = BANK_FIN ? num(BANK_FIN.total_deposits) : null;
  const organic = (BANK_GROWTH !== null && bankDep) ? bankDep * BANK_GROWTH / 100 : null;
  const ofBank = answers.market === 'all' && bankDep ? bankDep : totalDep;
  const tierDep = rows.filter(r => al.tierIds.has(r.uninumbr)).reduce((a, r) => a + (num(r.latest_dep) || 0), 0);
  const nBranch = [...al.bound.values()].filter(v => v === 'branch').length, nMarket = [...al.bound.values()].filter(v => v === 'market').length;
  const usePct = al.capacity > 0 ? 100 * goalDollars / al.capacity : null;
  const lineNormal = (organic !== null ? '\u2248 ' + money(organic) + ' a year without a campaign' : 'Last year\u2019s deposit growth') + (peerRow ? '; peers ' + peerRow.depyoy.toFixed(1) + '%' : '');
  const lineGoal = (ofBank > 0 ? (100 * goalDollars / ofBank).toFixed(1) + '% of the ' + (answers.market === 'all' ? 'bank' : 'selected markets') : '') + (tierDep > 0 ? ' \u00b7 ' + (100 * goalDollars / tierDep).toFixed(1) + '% of the top ' + al.tierIds.size : '');
  const lineCap = usePct === null ? '' : (al.unallocated > 1 ? 'this goal is ' + money(al.unallocated) + ' over the limit' : 'this goal uses ' + usePct.toFixed(0) + '%') + (al.bound.size ? ' \u00b7 ' + (nBranch + nMarket) + ' branches capped by size' : '');
  g('strip').innerHTML = `
    <div class="card"><h3>Normal growth</h3><div class="big">${BANK_GROWTH === null ? '—' : '+' + esc(BANK_GROWTH.toFixed(1)) + '%'}</div><div class="line" title="${esc(lineNormal)}">${esc(lineNormal)}</div></div>
    <div class="card"><h3>Campaign goal</h3><div class="big">${esc(money(goalDollars))}</div><div class="line" title="${esc(lineGoal)}">${esc(lineGoal)}</div></div>
    <div class="card"><h3>Capacity</h3><div class="big ${al.unallocated > 1 ? 'warn' : ''}">${esc(money(al.capacity))}</div><div class="line" title="${esc(lineCap + (al.bound.size ? ' (' + nBranch + ' by branch size, ' + nMarket + ' by market size)' : ''))}">${esc(lineCap)}</div></div>
    ${balanceCompact(goalDollars)}`;
  g('allMetrics').classList.toggle('dn', !SHOW_ALL);
  g('allMetrics').innerHTML = SHOW_ALL ? balanceFull(goalDollars) : '';
  const seeAll = g('seeAll');
  if (seeAll) seeAll.addEventListener('click', () => { SHOW_ALL = !SHOW_ALL; render(); });

  g('mode').innerHTML = isStandard ? 'Standard formula' : 'Scenario: not tested against history';
  g('mode').title = isStandard ? 'No goal preferences set: this ranking matches the stored one.' : 'The goal score re-weights the stored branch scores to match your answers. It has not been tested against history.';

  const cols = [['#', 'k-rk'], ['Branch', ''], ['Deposits', 'k-dep'], ['Score', 'k-score'], ['Standard', 'k-std']];
  if (isStandard) cols.push(['Zone and play', 'k-zp']);
  cols.push(['Share', 'k-share'], ['Why', 'k-why c-why']);
  g('thead').innerHTML = cols.map(c => `<th class="${c[1]}">${esc(c[0])}</th>`).join('');

  g('rows').innerHTML = rows.slice(0, 60).map((r, i) => {
    const mv = (r.was || r.rank) - r.rank;
    const mt = mv > 0 ? `<span class="up">\u25B2${mv}</span>` : (mv < 0 ? `<span class="down">\u25BC${-mv}</span>` : '');
    const z = r.opportunity_zone || '';
    const a = al.amounts.get(r.uninumbr), b = al.bound.get(r.uninumbr);
    const nm = cleanName(r.namebr);
    const city = [r.citybr, r.stalpbr].filter(Boolean).join(', ');
    const why = whyPlain(r.parts, w);
    const capTip = b === 'market' ? 'Limited to 1.5% of the deposits within 10 miles' : 'Limited to 10% of the branch\u2019s deposits';
    const tags = (r.excluded ? '<span class="ic" title="Head office or booking branch: left out of the goal share">HQ</span>' : '') +
      (r.partial ? '<span class="ic" title="Some parts are missing: scored on the parts that exist">part</span>' : '') +
      (r.sameMarketAs ? `<span class="ic" title="Same market as #${esc(r.sameMarketAs)}">=#${esc(r.sameMarketAs)}</span>` : '');
    return `<tr class="${i < 5 ? 'top' : ''}${String(SELECTED) === String(r.uninumbr) ? ' sel' : ''}" data-id="${esc(r.uninumbr)}" tabindex="0" role="button" aria-label="Open ${esc(nm)}" title="${esc(why)}">
      <td><span class="rk${r.rank <= 5 ? ' t5' : ''}">${r.rank}</span></td>
      <td><span class="nm">${esc(nm)}</span> <span class="ct">${esc(city)}</span>${tags}</td>
      <td>${esc(money(num(r.latest_dep) || 0))}</td>
      <td><b>${r.score === null ? '—' : Math.round(r.score)}</b></td>
      <td>#${esc(r.was)} ${mt}</td>
      ${isStandard ? `<td><span class="zone ${esc(z)}">${esc(z || '—')}</span><span class="play">${esc(r.campaign || '')}</span></td>` : ''}
      <td>${a ? esc(money(a)) + (b ? ` <span class="ic" title="${esc(capTip)}">cap</span>` : '') : '—'}</td>
      <td class="why c-why" title="${esc(whyFor(r.parts, w))}">${esc(why)}</td>
    </tr>`;
  }).join('');

  const isCU = BRANCHES.length && BRANCHES[0].institution_type && BRANCHES[0].institution_type !== 'bank';
  const footText = [
    'Click a row for the branch detail.',
    isStandard ? '' : 'Zone and play are hidden while goals are set: they are not re-cut for goals yet.',
    'Share goes to the top quarter of branches in proportion to score, capped at the lower of 10% of a branch\u2019s deposits or 1.5% of its 10-mile market.',
    isCU && answers.focus === 'share' ? 'Credit union: relative growth is institution-level, so take share cannot separate its branches.' : ''
  ].filter(Boolean).join(' ');
  g('foot').textContent = footText; g('foot').title = footText;
  if (SELECTED !== null && !g('detail').classList.contains('dn')) renderDetail(SELECTED);
}

// ── map
let MAP = null, MAP_LAYER = null, MAP_MARKERS = new Map(), MAP_KEY = null;
function radiusScale(values, minR, maxR) {
  const nums = values.map(v => +v || 0).filter(v => v > 0);
  if (!nums.length) return () => (minR + maxR) / 2;
  const min = Math.min(...nums), max = Math.max(...nums);
  if (min === max) return () => (minR + maxR) / 2;
  return v => { v = Math.max(min, Math.min(max, +v || min)); return minR + Math.sqrt((v - min) / (max - min)) * (maxR - minR); };
}
function markerStyle(r) {
  if (r.excluded) return { fillColor: '#F5A623', color: '#854F0B', weight: 2, dashArray: '4 3', fillOpacity: 0.05, opacity: 0.9 };
  if (r.score === null) return { fillColor: '#ffffff', color: '#8B93A0', weight: 1.5, dashArray: '3 3', fillOpacity: 0.3, opacity: 0.5 };
  if (r.rank <= 5) return { fillColor: '#02A7C2', color: '#083D5F', weight: 2.5, fillOpacity: 0.95, opacity: 1 };
  if (r.rank <= 15) return { fillColor: '#185FA5', color: '#ffffff', weight: 1, fillOpacity: 0.55, opacity: 0.75 };
  return { fillColor: '#8B93A0', color: '#ffffff', weight: 0.6, fillOpacity: 0.25, opacity: 0.45 };
}
function drawMap(rows, key) {
  if (typeof L === 'undefined') return;
  if (!MAP) {
    MAP = L.map('map', { zoomControl: true, attributionControl: false, scrollWheelZoom: false }).setView([37.8, -96], 4);
    L.control.attribution({ prefix: false, position: 'bottomright' }).addTo(MAP);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OpenStreetMap contributors', subdomains: 'abc', maxZoom: 19 }).addTo(MAP);
    MAP_LAYER = L.layerGroup().addTo(MAP);
  }
  MAP_LAYER.clearLayers(); MAP_MARKERS = new Map();
  const pts = rows.filter(r => num(r.sims_latitude) !== null && num(r.sims_longitude) !== null);
  const rs0 = radiusScale(pts.filter(r => !r.excluded).map(r => r.latest_dep), 4, 16);
  pts.forEach(r => {
    const base = r.excluded ? 10 : rs0(r.latest_dep);
    const rad = r.rank <= 5 && !r.excluded ? Math.max(base, 11) + 4 : (r.rank <= 15 ? base : Math.min(base, 8));
    const m = L.circleMarker([+r.sims_latitude, +r.sims_longitude], { radius: rad, ...markerStyle(r) });
    m.bindTooltip(`${esc(cleanName(r.namebr))}: ${r.score === null ? 'no score' : 'score ' + Math.round(r.score)} (#${r.rank})`, { direction: 'top' });
    m.on('click', () => selectBranch(r.uninumbr));
    m.addTo(MAP_LAYER);
    if (r.rank <= 5 && !r.excluded) m.bindTooltip(String(r.rank), { permanent: true, direction: 'center', className: 'rkt' });
    MAP_MARKERS.set(String(r.uninumbr), { m, r });
  });
  const fit = pts.length && key !== MAP_KEY;
  const bounds = pts.map(r => [+r.sims_latitude, +r.sims_longitude]);
  if (fit) { MAP.fitBounds(bounds, { padding: [30, 30], maxZoom: 11 }); MAP_KEY = key; }
  setTimeout(() => { if (!MAP) return; MAP.invalidateSize(); if (fit) MAP.fitBounds(bounds, { padding: [30, 30], maxZoom: 11 }); }, 80);
  if (SELECTED !== null) hoverRow(SELECTED, true);
}
function hoverRow(uninumbr, on) {
  const e = MAP_MARKERS.get(String(uninumbr));
  if (!e) return;
  const st = markerStyle(e.r);
  e.m.setStyle({ weight: on ? 4 : st.weight, color: on ? '#F5A623' : st.color });
  if (on) e.m.bringToFront();
}

// ── branch detail (replaces the map until "Back to map")
const normName = s => (s || '').trim().toLowerCase();
async function loadRates() {
  if (RATES) return RATES;
  const rows = await api('vw_rate_radar_latest', 'select=bank_name,cd_apy,cd_term,savings_apy,high_yield_savings_apy,money_market_apy,checking_apy,data_quality,run_at&order=run_at.desc&limit=2000');
  RATES = {};
  (Array.isArray(rows) ? rows : []).forEach(r => { const k = normName(r.bank_name); if (!RATES[k]) RATES[k] = r; });
  return RATES;
}
function rateChips(r, cls) {
  const chips = [];
  const add = (label, v, extra) => { if (v !== null && v !== undefined && v !== '' && !isNaN(+v)) chips.push(`<span class="rate ${cls || ''}">${esc(label)} <b>${(+v).toFixed(2)}%</b>${extra ? ' ' + esc(extra) : ''}</span>`); };
  add('CD', r.cd_apy, r.cd_term ? r.cd_term + ' mo' : '');
  add('Savings', r.savings_apy); add('High-yield', r.high_yield_savings_apy);
  add('Money market', r.money_market_apy); add('Checking', r.checking_apy);
  return chips.join('');
}
function backToMap(silent) {
  g('detail').classList.add('dn'); g('mapWrap').classList.remove('dn');
  if (MAP) setTimeout(() => MAP.invalidateSize(), 50);
  if (!silent) document.querySelectorAll('#rows tr.sel').forEach(t => t.classList.remove('sel'));
}
function selectBranch(uninumbr) {
  if (SELECTED !== null) hoverRow(SELECTED, false);
  SELECTED = uninumbr;
  document.querySelectorAll('#rows tr.sel').forEach(t => t.classList.remove('sel'));
  const tr = document.querySelector(`#rows tr[data-id="${String(uninumbr).replace(/"/g, '')}"]`);
  if (tr) { tr.classList.add('sel'); tr.scrollIntoView({ block: 'nearest' }); }
  hoverRow(uninumbr, true);
  renderDetail(uninumbr);
}
async function renderDetail(uninumbr) {
  const r = RANKED.find(x => String(x.uninumbr) === String(uninumbr));
  if (!r) return;
  const w = LAST_W, br = partBreakdown(r.parts, w);
  const z = r.opportunity_zone || '', play = r.campaign || '', std = num(r.opportunity_score);
  const a = LAST_ALLOC ? LAST_ALLOC.amounts.get(r.uninumbr) : 0, b = LAST_ALLOC ? LAST_ALLOC.bound.get(r.uninumbr) : null;
  const inTier = LAST_ALLOC ? LAST_ALLOC.tierIds.has(r.uninumbr) : false;
  const shareText = r.excluded ? 'Head office or booking branch: left out of the goal share.'
    : (inTier ? esc(money(a || 0)) + (b ? ' (capped: ' + (b === 'market' ? 'limited to 1.5% of the deposits within 10 miles' : 'limited to 10% of the branch\u2019s deposits') + ')' : ' (not capped)') : 'Not in the top tier, so no share of this goal.');
  g('mapWrap').classList.add('dn');
  const d = g('detail');
  d.classList.remove('dn');
  d.innerHTML = `
    <div class="dh"><div><div class="t">${esc(cleanName(r.namebr))}</div>
      <div class="s">${esc([r.citybr, r.stalpbr].filter(Boolean).join(', '))} &middot; ${esc(money(num(r.latest_dep) || 0))} deposits &middot; goal rank #${esc(r.rank)}</div></div>
      <button type="button" class="btn teal" id="backMap">Back to map</button></div>
    <div class="dsec"><div class="chips">
      <div class="chip">Goal score<b>${r.score === null ? '—' : Math.round(r.score)}</b></div>
      <div class="chip">Standard<b>${std === null ? '—' : Math.round(std)} (#${esc(r.was)})</b></div>
      <div class="chip">Goal share<b>${r.excluded || !inTier ? '—' : esc(money(a || 0))}</b></div></div>
      <p class="note" style="margin:6px 0 0">${shareText}</p>
      ${r.partial ? '<p class="note">Some parts are missing for this branch, so the score uses the parts that exist.</p>' : ''}</div>
    <div class="dsec"><div class="label">Why</div>
      <p style="margin:0 0 6px">${esc(whyPlain(r.parts, w))}.</p>
      <table class="mini"><thead><tr><th>Part</th><th>Value</th><th>Weight</th><th></th></tr></thead><tbody>
      ${br.map(x => `<tr><td>${esc(x.label)}</td><td>${x.value === null ? '—' : Math.round(x.value)}</td><td>${Math.round(x.weight * 100)}%</td><td style="width:40%"><div class="bar"><i style="width:${x.value === null ? 0 : Math.round(x.value)}%"></i></div></td></tr>`).join('')}
      </tbody></table></div>
    <div class="dsec"><div class="label">Play</div>
      ${play ? `<div><b>${esc(play)}</b>${z ? ' &middot; ' + esc(z) + ' zone' : ''}</div><p style="margin:4px 0 0">${esc(PLAY_MEANING[play] || ZONE_PLAIN[z] || '')}</p>` : '<p class="note">No play is stored for this branch.</p>'}
      <p class="note" style="margin:4px 0 0">${LAST_STD ? 'From the standard ranking.' : 'This is the play from the standard ranking; zone and play are not re-cut for your goals yet.'}</p></div>
    <div class="dsec"><div class="label">Nearby competitors and rates</div><div id="detailComps" class="note">Loading…</div></div>`;
  g('backMap').addEventListener('click', () => backToMap(false));

  const [comps, rates] = await Promise.all([
    api('branch_target_competitors', `my_branch_id=eq.${encodeURIComponent(uninumbr)}&select=target_namefull,target_dep_m,target_rank,vuln_score&order=target_rank.asc&limit=3`),
    loadRates()
  ]);
  const box = g('detailComps');
  if (!box || String(SELECTED) !== String(uninumbr)) return;
  if (!Array.isArray(comps) || !comps.length) { box.textContent = 'No named competitors computed for this branch yet.'; return; }
  const bankName = BRANCHES[0] ? BRANCHES[0].namefull : '';
  const mine = rates[normName(bankName)];
  box.className = '';
  box.innerHTML = comps.map((c, i) => {
    const live = rates[normName(c.target_namefull)];
    const dep = num(c.target_dep_m);
    const theirs = live ? rateChips(live) : '';
    const ours = mine ? rateChips(mine, 'bank') : '';
    return `<div class="comp"><div><b>${esc(cleanName(c.target_namefull))}</b>${i === 0 ? ' <span class="ic">top rival</span>' : ''}</div>
      <div class="note">${dep !== null ? esc(money(dep * 1e6)) + ' deposits' : ''}${c.vuln_score !== null && c.vuln_score !== undefined ? ' &middot; vulnerability ' + esc(Math.round(+c.vuln_score)) : ''}</div>
      ${live && theirs ? `<div class="note" style="margin-top:4px">Theirs (Rate Radar ${esc(String(live.run_at || '').slice(0, 10))}${live.data_quality ? ', ' + esc(live.data_quality) + ' quality' : ''})</div>${theirs}
        ${ours ? `<div class="note" style="margin-top:4px">${esc(bankName)}</div>${ours}` : '<div class="note" style="margin-top:4px">The bank\u2019s own rates are not in Rate Radar yet.</div>'}`
      : '<div class="note" style="margin-top:4px">No Rate Radar reading for this competitor yet.</div>'}</div>`;
  }).join('');
}

// ── events
g('rows').addEventListener('mouseover', e => { const tr = e.target.closest('tr[data-id]'); if (tr) hoverRow(tr.dataset.id, true); });
g('rows').addEventListener('mouseout', e => { const tr = e.target.closest('tr[data-id]'); if (tr && String(tr.dataset.id) !== String(SELECTED)) hoverRow(tr.dataset.id, false); });
g('rows').addEventListener('click', e => { const tr = e.target.closest('tr[data-id]'); if (tr) selectBranch(tr.dataset.id); });
g('rows').addEventListener('keydown', e => { if (e.key === 'Enter') { const tr = e.target.closest('tr[data-id]'); if (tr) selectBranch(tr.dataset.id); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !g('detail').classList.contains('dn')) backToMap(false); });
g('changeBank').addEventListener('click', () => {
  history.replaceState(null, '', location.pathname);
  g('plan').classList.add('dn'); g('changeBank').classList.add('dn'); g('pickWrap').classList.remove('dn');
  g('bankName').textContent = 'Choose a bank'; g('si').value = ''; g('results').classList.add('dn'); g('si').focus();
});
g('loginBtn').addEventListener('click', login);
g('pw').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
g('si').addEventListener('input', e => { clearTimeout(searchTimer); const q = e.target.value; searchTimer = setTimeout(() => search(q), 250); });
{ const role = sessionStorage.getItem('hub_role'); if (sessionStorage.getItem('hub_token') && (!role || role === 'admin')) start(); }
