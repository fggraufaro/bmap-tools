# Blocks commits that contain secrets. One-time setup per machine:
#   pip install pre-commit
#   pre-commit install
# Findings that are intentional (for example a public, non-secret key) go in
# .secrets.baseline: run `detect-secrets scan --plugin scripts/secret_plugins.py
# --baseline .secrets.baseline` and review the diff before committing it.
repos:
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
